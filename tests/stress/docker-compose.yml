name: dispytch-stress-test
services:
  kafka:
    image: redpandadata/redpanda:latest
    container_name: dispytch-stress-test-kafka
    command:
      - redpanda
      - start
      - --kafka-addr=INSIDE://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr=INSIDE://kafka:9092,OUTSIDE://localhost:19092
    ports:
      - "9092:9092"
      - "9644:9644"
      - "19092:19092"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9644/v1/status/ready" ]
      interval: 5s
      retries: 5
      start_period: 10s
      timeout: 5s

  k6-flood:
    image: mostafamoradian/xk6-kafka:latest
    profiles: ["tools"]
    volumes:
      - ./kafka-flood.js:/script.js
    command: [ "run", "/script.js" ]
    depends_on:
      kafka:
        condition: service_healthy

  kafka-observer:
    image: confluentinc/cp-kafka:latest
    container_name: kafka-observer
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ "bash", "-c", "kafka-console-consumer --bootstrap-server kafka:9092 --topic my-load-test-topic --from-beginning" ]